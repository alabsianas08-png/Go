name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: 2. تثبيت أدوات Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: 3. تهيئة ملف buildozer.spec تلقائياً
        run: |
          buildozer init
          # تعديل الملف ليتناسب مع مشروعنا
          sed -i 's/^title = .*/title = Researcher/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = academicsearch/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.research/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,requests,beautifulsoup4,arxiv,pyalex,textacy,spacy,PyPDF2,ebooklib,android/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 30/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
          echo "icon.filename = icon.png" >> buildozer.spec
          # إنشاء أيقونة وهمية (لتجنب أخطاء غياب الصورة)
          echo "" | base64 -d > icon.png

      - name: 4. بناء ملف APK (السحر يحدث هنا)
        run: |
          buildozer android debug deploy
          ls -la bin/

      - name: 5. رفع ملف APK كقطعة قابلة للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: تطبيق-الباحث-الأكاديمي
          path: bin/*.apk
